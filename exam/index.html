function landing(){app.innerHTML='<div class="panel"><h1>ข้อสอบปลายภาค • ภูมิคุ้มกันวิทยา</h1><p class="muted">ฝึกทำข้อสอบจากเอกสาร จำนวน '+BANK.length+' ข้อ ตอบแล้วรู้ผลทันที พร้อมคำอธิบาย</p><div class="chips"><button class="chip '+(!random?'active':'')+'" id="normal">เรียงตามข้อเดิม</button><button class="chip '+(random?'active':'')+'" id="random">สุ่มลำดับข้อ</button></div><button class="action" id="start">เริ่มทำข้อสอบ</button><p class="note">ตัวเลือก ก–จ สร้างขึ้นเพื่อฝึกทำข้อสอบจากคำถามและเฉลยในไฟล์ ไม่ใช่ตัวเลือกต้นฉบับ เฉลยบางข้อในไฟล์อาจคลาดเคลื่อน โปรดตรวจสอบกับตำรา</p></div>';document.getElementById('normal').onclick=()=>{random=false;landing()};document.getElementById('random').onclick=()=>{random=true;landing()};document.getElementById('start').onclick=start}
function start(){questions=[...BANK];if(random){for(let i=questions.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[questions[i],questions[j]]=[questions[j],questions[i]]}}index=0;answers={};render()}
function render(){if(index>=questions.length){finish();return}let q=questions[index],selected=answers[q.id],done=selected!==undefined,correct=selected===q.correct,score=questions.filter(x=>answers[x.id]===x.correct).length;app.innerHTML='<div class="panel"><div class="top"><b>ข้อ '+(index+1)+' / '+questions.length+'</b><span class="muted">ตอบแล้ว '+Object.keys(answers).length+' • ถูก '+score+'</span></div><div class="track"><div class="bar" style="width:'+((index+1)/questions.length*100)+'%"></div></div><div class="muted" style="margin-bottom:9px">ข้อที่ '+q.id+' จากเอกสาร</div><h2 class="question">'+esc(q.q)+'</h2><div class="options">'+q.opts.map((o,i)=>'<button class="opt '+(done?(i===q.correct?'correct':i===selected?'wrong':''):'')+'" data-i="'+i+'" '+(done?'disabled':'')+'><span class="letter">'+letters[i]+'</span><span>'+esc(o)+'</span></button>').join('')+'</div>'+(done?'<div class="feedback '+(correct?'good':'bad')+'"><b>'+(correct?'✓ ถูกต้อง':'✕ ยังไม่ถูกต้อง')+'</b><div>คำตอบ: '+letters[q.correct]+'. '+esc(q.opts[q.correct])+'</div><div>'+esc(q.ex)+'</div></div>':'')+'<div class="actions"><button class="action secondary" id="prev" '+(index===0?'disabled':'')+'>ย้อนกลับ</button><button class="action" id="next" '+(!done?'disabled':'')+'>'+(index===questions.length-1?'ดูสรุปคะแนน':'ข้อถัดไป →')+'</button></div></div>';document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(!done){answers[q.id]=Number(b.dataset.i);render()}});document.getElementById('prev').onclick=()=>{index--;render()};document.getElementById('next').onclick=()=>{index++;render()}}
function finish(){let score=questions.filter(x=>answers[x.id]===x.correct).length;app.innerHTML='<div class="panel" style="text-align:center"><h1>สรุปผลการทำข้อสอบ</h1><div class="score">'+score+' / '+questions.length+'</div><p>คิดเป็น '+Math.round(score/questions.length*100)+'%</p><p class="muted">คุณสามารถเริ่มทำใหม่หรือสุ่มข้อสอบอีกครั้งได้</p><div class="actions" style="justify-content:center"><button class="action secondary" id="again">ทำใหม่</button><button class="action" id="review">ทบทวนคำตอบ</button></div></div>';document.getElementById('again').onclick=start;document.getElementById('review').onclick=()=>{index=0;render()}}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}landing();
</script></body></html>
