                    { text: "Bacterial Empyema", correct: false }
                ]
            },
            {

                question: "ข้อใดคือลักษณะของ pleomorphism",
                options: [
                    { text: "เป็นลักษณะของ malignant cell ที่มีขนาดของเซลล์ที่แตกต่างกันอย่างมาก", correct: true },
                    { text: "เป็นลักษณะของ monocyte ที่มีขนาดของเซลล์ที่แตกต่างกันอย่างมาก", correct: false },
                    { text: "เป็นลักษณะของ benign cell ที่มีขนาดของเซลล์ที่เท่าๆกัน และ แตกต่างกัน โดยอยู่ปนกัน", correct: false },
                    { text: "เป็นลักษณะของ benign cell ที่มีสีของ cytoplasm ติดสีเข้มกว่าปกติ", correct: false },
                    { text: "เป็นลักษณะของ malignant cell ที่มีขนาดของเซลล์ที่เท่าๆกัน", correct: false }
                ]
            },
            {
                category: "CYTOLOGY",
                question: "ข้อใด เป็นมะเร็งที่พบได้บ่อย บริเวณเนื้อเยื่อบุ Epithelial Cell ของอวัยวะต่าง ๆ โดยจะพัฒนาขึ้นที่เซลล์เยื่อบุทั้งด้านในและด้านนอกของพื้นผิวร่างกาย",
                options: [
                    { text: "Sarcoma", correct: false },
                    { text: "Carcinoma", correct: true },
                    { text: "Lymphoma", correct: false },
                    { text: "Leukemia", correct: false },
                    { text: "Germ Cell Tumor", correct: false }
                ]
            },
            {
                category: "CYTOLOGY",
                question: "ข้อใดเป็นลักษณะเด่นของ Mesothelial cell",
                options: [
                    { text: "Nucleus หลายอัน และไม่มี Cytoplasm", correct: false },
                    { text: "Cytoplasm มาก ขอบเซลล์เรียบ และอาจพบ \"window\" ระหว่างเซลล์", correct: true },
                    { text: "ไม่มี Nucleus", correct: false },
                    { text: "มี Granule จำนวนมาก", correct: false },
                    { text: "รูปร่างเป็นแท่ง", correct: false }
                ]
            },
            {
                category: "CYTOLOGY",
                question: "Pleural fluid พบเซลล์รวมกันเป็นกลุ่ม (Three-dimensional clusters) มี N/C ratio สูง นิวเคลียสไม่สม่ำเสมอ และมี Nucleoli เด่น ควรสงสัยข้อใด",
                options: [
                    { text: "Reactive mesothelial cell", correct: false },
                    { text: "Macrophage", correct: false },
                    { text: "Neutrophil", correct: false },
                    { text: "Malignant cell", correct: true },
                    { text: "Mesothelial cell ปกติ", correct: false }
                ]
            },
            {
                category: "CYTOLOGY",
                question: "การเตรียมสิ่งส่งตรวจประเภท Effusion ควรส่งถึงห้องปฏิบัติการภายในเวลาเท่าใด",
                options: [
                    { text: "2 ชั่วโมง", correct: false },
                    { text: "6 ชั่วโมง", correct: false },
                    { text: "12 ชั่วโมง", correct: true },
                    { text: "24 ชั่วโมง", correct: false },
                    { text: "48 ชั่วโมง", correct: false }
                ]
            }
        ];

        // App State
        let currentQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let currentCategory = '';
        let isAnswered = false;

        // DOM Elements
        const menuScreen = document.getElementById('menu-screen');
        const quizScreen = document.getElementById('quiz-screen');
        const resultScreen = document.getElementById('result-screen');
        const homeBtn = document.getElementById('home-btn');
        const categoryLabel = document.getElementById('quiz-category');
        const progressLabel = document.getElementById('quiz-progress');
        const questionText = document.getElementById('question-text');
        const optionsContainer = document.getElementById('options-container');
        const nextBtn = document.getElementById('next-btn');
        const scoreText = document.getElementById('score-text');
        const feedbackText = document.getElementById('feedback-text');
        const retryBtn = document.getElementById('retry-btn');

        // Event Listeners
        homeBtn.addEventListener('click', showMenu);
        nextBtn.addEventListener('click', handleNext);
        retryBtn.addEventListener('click', () => startQuiz(currentCategory));

        // Utility: Shuffle Array (Fisher-Yates)
        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        // Functions
        function showMenu() {
            menuScreen.classList.remove('hidden');
            quizScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            homeBtn.classList.add('hidden');
        }

        function startQuiz(category) {
            currentCategory = category;
            
            // Filter questions
            if (category === 'ALL') {
                currentQuestions = [...database];
                categoryLabel.textContent = 'สุ่มทุกบท';
            } else {
                currentQuestions = database.filter(q => q.category === category);
                categoryLabel.textContent = category;
            }

            // Shuffle questions
            currentQuestions = shuffle(currentQuestions);
            
            // Reset state
            currentIndex = 0;
            score = 0;
            
            // UI transitions
            menuScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            quizScreen.classList.remove('hidden');
            homeBtn.classList.remove('hidden');

            renderQuestion();
        }

        function renderQuestion() {
            isAnswered = false;
            nextBtn.classList.add('hidden');
            
            const q = currentQuestions[currentIndex];
            progressLabel.textContent = `ข้อ ${currentIndex + 1} / ${currentQuestions.length}`;
            questionText.textContent = `${currentIndex + 1}. ${q.question}`;
            
            // Clear old options
            optionsContainer.innerHTML = '';
            
            // Clone options and shuffle them
            let options = JSON.parse(JSON.stringify(q.options));
            options = shuffle(options);

            options.forEach((opt) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn w-full text-left bg-gray-50 border-2 border-gray-200 hover:bg-gray-100 text-gray-700 font-medium py-3 px-5 rounded-lg';
                btn.textContent = opt.text;
                
                btn.onclick = () => selectOption(btn, opt.correct, options);
                optionsContainer.appendChild(btn);
            });
        }

        function selectOption(selectedBtn, isCorrect, optionsData) {
            if (isAnswered) return; // Prevent multiple clicks
            isAnswered = true;

            const allBtns = optionsContainer.querySelectorAll('button');
            
            // Find the correct option text to highlight it if user was wrong
            const correctText = optionsData.find(o => o.correct).text;

            allBtns.forEach(btn => {
                btn.classList.add('disabled');
                
                // Highlight correct answer
                if (btn.textContent === correctText) {
                    btn.classList.add('correct');
                    btn.classList.remove('border-gray-200');
                }
                
                // Highlight incorrect if user selected it
                if (btn === selectedBtn && !isCorrect) {
                    btn.classList.add('incorrect');
                    btn.classList.remove('border-gray-200');
                }
            });

            if (isCorrect) score++;

            nextBtn.classList.remove('hidden');
            if (currentIndex === currentQuestions.length - 1) {
                nextBtn.textContent = 'ดูผลคะแนน';
            } else {
                nextBtn.textContent = 'ข้อต่อไป \u2192'; // Right arrow
            }
        }

        function handleNext() {
            if (currentIndex < currentQuestions.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizScreen.classList.add('hidden');
            resultScreen.classList.remove('hidden');
            homeBtn.classList.add('hidden');

            const percent = Math.round((score / currentQuestions.length) * 100);
            scoreText.textContent = `${score} / ${currentQuestions.length}`;
            
            if (percent >= 80) {
                feedbackText.textContent = "ยอดเยี่ยมมาก! ความรู้แน่นสุดๆ 🎉";
            } else if (percent >= 50) {
                feedbackText.textContent = "เก่งมาก! ทบทวนอีกนิดรับรองว่าเป๊ะ 👍";
            } else {
                feedbackText.textContent = "สู้ๆ! ลองทำใหม่อีกครั้งเพื่อทบทวนความรู้นะ ✌️";
            }
        }
    </script>
</body>
