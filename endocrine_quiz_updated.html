let answers=Array(qs.length).fill(null);const el=id=>document.getElementById(id);
function render(){const done=answers.filter(v=>v!==null).length;const right=qs.reduce((sum,q,i)=>sum+(answers[i]===q.a?1:0),0);
el('progressText').textContent=`ทำแล้ว ${done} / ${qs.length} ข้อ`;
el('barFill').style.width=`${done/qs.length*100}%`;
el('remaining').textContent=`ถูก ${right} ข้อ · เหลือ ${qs.length-done} ข้อ`;
el('modeText').textContent='เฉลยทันที';
el('result').classList.toggle('hidden',done!==qs.length);
if(done===qs.length){el('result').innerHTML=`<strong>ทำครบทุกข้อแล้ว!</strong><div class="score">${right} / ${qs.length}</div><p>คะแนน ${Math.round(right/qs.length*100)}% · กด “↻ ทำใหม่” เพื่อเริ่มรอบใหม่</p>`;}
el('questions').innerHTML=qs.map((q,i)=>{const chosen=answers[i];const answered=chosen!==null;
return `<section class="card" id="question-${i+1}"><div class="meta">ข้อ ${i+1} จาก ${qs.length} · ข้อต้นฉบับ ${q.n}</div><div class="question">${q.q}</div><div class="options">${q.o.map((o,j)=>`<button type="button" class="opt ${answered&&q.a===j?'correct':''} ${answered&&chosen===j&&q.a!==j?'wrong':''}" data-i="${i}" data-j="${j}" ${answered?'disabled':''}><span class="num">${j+1}.</span><span>${o}</span>${answered&&q.a===j?'<span class="status">✓</span>':''}${answered&&chosen===j&&q.a!==j?'<span class="status">✕</span>':''}</button>`).join('')}</div>${answered?`<div class="explain"><strong>${chosen===q.a?'✓ ตอบถูกต้อง':'✕ ตอบไม่ถูกต้อง'} · เฉลยข้อ ${q.a+1}: ${q.o[q.a]}</strong><div>${q.e}</div></div>${i<qs.length-1?`<button class="btn next" data-next="${i+2}">ข้อถัดไป →</button>`:''}`:''}</section>`}).join('');
}
document.addEventListener('click',event=>{const opt=event.target.closest('button[data-i]');if(opt){const i=Number(opt.dataset.i);if(answers[i]!==null)return;answers[i]=Number(opt.dataset.j);render();return;}const next=event.target.closest('button[data-next]');if(next){el('question-'+next.dataset.next)?.scrollIntoView({behavior:'smooth',block:'start'});}});
el('reset').onclick=()=>{if(answers.some(x=>x!==null)&&!confirm('ต้องการล้างคำตอบทั้งหมดและทำข้อสอบใหม่ใช่หรือไม่?'))return;answers=Array(qs.length).fill(null);render();window.scrollTo({top:0,behavior:'smooth'})};
render();
</script></body></html>
